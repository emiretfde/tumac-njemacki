name: Verify live SEO HTTP responses (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check canonical redirects, pages, sitemap and development noindex
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect)
          failures = []
          warnings = []
          UA = "TumacPublicSeoReadOnlyCheck/1.0"

          def fetch(url):
              request = urllib.request.Request(url, headers={
                  "User-Agent": UA,
                  "Accept": "text/html,application/xml,text/xml,*/*",
                  "Cache-Control": "no-cache",
              })
              try:
                  response = opener.open(request, timeout=20)
              except urllib.error.HTTPError as err:
                  response = err
              with response:
                  status = response.code
                  location = response.headers.get("Location", "")
                  content_type = response.headers.get("Content-Type", "")
                  xrobots = response.headers.get("X-Robots-Tag", "")
                  data = response.read(400000)
              print(f"{status} | {url} | location={location or '-'} | type={content_type} | xrobots={xrobots or '-'}")
              return status, location, content_type, xrobots, data

          redirects = {
              "https://tumac-njemacki.me/": "https://tumac-njemacki.me/me/",
              "https://tumac-njemacki.me/index.html": "https://tumac-njemacki.me/me/",
              "https://www.tumac-njemacki.me/me/": "https://tumac-njemacki.me/me/",
          }
          for url, expected in redirects.items():
              try:
                  status, location, _, _, _ = fetch(url)
                  if status != 301 or location != expected:
                      failures.append(f"Expected HTTP 301 to {expected} from {url}; got {status}, {location}")
              except Exception as e:
                  failures.append(f"Redirect request failed at {url}: {e}")

          pages = [
              "https://tumac-njemacki.me/me/",
              "https://tumac-njemacki.me/de/",
              "https://tumac-njemacki.me/me/prevod-saobracajne-dozvole.html",
              "https://tumac-njemacki.me/de/prevod-saobracajne-dozvole.html",
          ]
          for url in pages:
              try:
                  status, _, mime, xrobots, body = fetch(url)
                  lower = body.lower()
                  if status != 200:
                      failures.append(f"Page is not HTTP 200: {url} (got {status})")
                  if "noindex" in xrobots.lower() or b'content="noindex' in lower:
                      failures.append(f"Official indexed page has noindex: {url}")
                  if "text/html" not in mime.lower():
                      failures.append(f"Official indexed page not HTML: {url} ({mime})")
                  if b'<link rel="canonical" href="https://tumac-njemacki.me/' not in body:
                      failures.append(f"Official canonical not found: {url}")
              except Exception as e:
                  failures.append(f"Page request failed at {url}: {e}")

          try:
              status, _, _, _, _ = fetch("https://tumac-njemacki.me/en/")
              if status != 410:
                  failures.append(f"Retired /en/ should return HTTP 410, got {status}")
          except Exception as e:
              failures.append(f"Retired /en/ request failed: {e}")

          try:
              status, _, mime, _, body = fetch("https://tumac-njemacki.me/sitemap.xml")
              if status != 200 or not mime.lower().startswith(("application/xml", "text/xml")):
                  failures.append(f"Sitemap status or XML MIME wrong: {status}, {mime}")
              else:
                  root = ET.fromstring(body)
                  ns = {"s": "http://www.sitemaps.org/schemas/sitemap/0.9"}
                  locs = [n.text for n in root.findall("s:url/s:loc", ns)]
                  print("SITEMAP URLS:", locs)
                  if sorted(locs) != sorted(pages):
                      failures.append(f"Sitemap URL list mismatch: {locs}")
          except Exception as e:
              failures.append(f"Sitemap request/parse failed: {e}")

          try:
              status, _, _, _, body = fetch("https://tumac-njemacki.me/robots.txt")
              if status != 200 or b"Sitemap: https://tumac-njemacki.me/sitemap.xml" not in body:
                  failures.append("Production robots.txt status or sitemap reference is wrong")
          except Exception as e:
              failures.append(f"Robots request failed: {e}")

          # Separate warning: this repository may not auto-deploy to Cloudflare Pages.
          try:
              status, _, _, xrobots, _ = fetch("https://tumac-njemacki.pages.dev/me/")
              if status != 200 or "noindex" not in xrobots.lower():
                  warnings.append(f"Check Cloudflare Pages deployment: expected noindex on pages.dev, got {status}, {xrobots!r}")
          except Exception as e:
              warnings.append(f"Cloudflare Pages verification unavailable: {e}")

          for warning in warnings:
              print("WARNING:", warning)
          for failure in failures:
              print("FAIL:", failure)
          if failures:
              raise SystemExit(f"FAIL: {len(failures)} public production SEO checks")
          print("PASS: canonical redirect, 4 pages, retired EN, robots.txt and sitemap checks")
          if warnings:
              print("Cloudflare Pages noindex requires a separate follow-up (warning above).")
          PY
