name: Diagnose public sitemap HTTP response (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch sitemap and inspect response
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          url = 'https://tumac-njemacki.me/sitemap.xml?diagnostic=20261011'
          req = urllib.request.Request(url, headers={
              'User-Agent':'TumacSitemapDiagnostic/1.0',
              'Cache-Control':'no-cache',
              'Accept':'application/xml,text/xml,*/*'
          })
          try:
              with urllib.request.urlopen(req, timeout=20) as res:
                  body=res.read(1000000)
                  mime=res.headers.get('Content-Type','(not supplied)')
                  print('STATUS:',res.status)
                  print('FINAL URL:',res.url)
                  print('CONTENT-TYPE:',mime)
                  print('CONTENT-LENGTH:',len(body))
                  print('BODY START:',repr(body[:110]))
          except Exception as exc:
              raise SystemExit('HTTP REQUEST FAILED: '+str(exc))
          try:
              root=ET.fromstring(body)
          except ET.ParseError as exc:
              raise SystemExit('XML INVALID: '+str(exc))
          print('XML ROOT:',root.tag)
          links=[e.text for e in root.findall('{http://www.sitemaps.org/schemas/sitemap/0.9}url/{http://www.sitemaps.org/schemas/sitemap/0.9}loc')]
          print('SITEMAP PAGE URLS:',links)
          if len(links)!=6:
              raise SystemExit('Unexpected sitemap URL count')
          if not all(link and link.startswith('https://tumac-njemacki.me/') for link in links):
              raise SystemExit('Unexpected sitemap hosts')
          if not mime.lower().startswith(('application/xml','text/xml')):
              raise SystemExit('SITEMAP XML BODY IS VALID BUT HTTP CONTENT-TYPE IS WRONG')
          print('PASS: valid XML sitemap and correct HTTP Content-Type')
          PY
